name: Daily AI Content Poster

on:
  schedule:
    # Runs on the 0th minute of every hour, 24/7
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual triggering of the workflow from GitHub Actions tab
    inputs:
      count:
        description: 'Number of posts to generate per page'
        required: true
        default: '1'
      page:
        description: 'Specific page name to run for (leave empty for all)'
        required: false
        default: ''
      retry_pending:
        description: 'Retry failed pending uploads'
        type: boolean
        required: false
        default: false

jobs:
  post-content:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Auto Publisher
      env:
        # Load secrets from GitHub Repository Secrets
        NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        # Pass page tokens. You should add these secrets in your repository settings.
        FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        FB_PAGE_TOKEN_FACTS: ${{ secrets.FB_PAGE_TOKEN_FACTS }}
        FB_PAGE_TOKEN_MOTIVATION: ${{ secrets.FB_PAGE_TOKEN_MOTIVATION }}
        FB_PAGE_TOKEN_3: ${{ secrets.FB_PAGE_TOKEN_3 }}
        FB_PAGE_TOKEN_4: ${{ secrets.FB_PAGE_TOKEN_4 }}
        FB_PAGE_TOKEN_5: ${{ secrets.FB_PAGE_TOKEN_5 }}
        FB_PAGE_TOKEN_6: ${{ secrets.FB_PAGE_TOKEN_6 }}
        FB_PAGE_TOKEN_7: ${{ secrets.FB_PAGE_TOKEN_7 }}
        FB_PAGE_TOKEN_8: ${{ secrets.FB_PAGE_TOKEN_8 }}
        FB_PAGE_TOKEN_9: ${{ secrets.FB_PAGE_TOKEN_9 }}
        FB_PAGE_TOKEN_10: ${{ secrets.FB_PAGE_TOKEN_10 }}
      run: |
        # Check if we should retry pending failed uploads
        if [ "${{ github.event.inputs.retry_pending }}" = "true" ]; then
          CMD="python main.py --retry-pending"
        else
          CMD="python main.py"
          # Add count if triggered manually
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="$CMD --count ${{ github.event.inputs.count }} --force"
            if [ -n "${{ github.event.inputs.page }}" ]; then
              CMD="$CMD --page \"${{ github.event.inputs.page }}\""
            fi
          else
            # Default count for scheduled run (which will check pages.json schedule hours)
            CMD="$CMD --count 1"
          fi
        fi
        
        echo "Running command: $CMD"
        eval $CMD

    - name: Commit and Push History
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/history.json docs/pending_uploads.json docs/pending_uploads/* || true
        git commit -m "Update post history and pending uploads queue [skip ci]" || true
        git push origin main || true
