name: Manual Face Swapper

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Paste Reels/Shorts/TikTok URLs (one URL per line)'
        required: true
        type: string
      influencer_image:
        description: 'Influencer face photo filename (e.g. karan.jpg - must be uploaded in influencer_faces/ folder)'
        required: true
        type: string
        default: 'karan.jpg'
      enhance:
        description: 'Enable GFPGAN Face Enhancement (highly recommended for natural/sharp look)'
        type: boolean
        required: false
        default: true
      force:
        description: 'Force process even if URLs already exist in history'
        type: boolean
        required: false
        default: false

jobs:
  face-swap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r faceswapper/requirements.txt

    - name: Run Face Swapper Pipeline
      env:
        REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
      run: |
        # Write the list of URLs from inputs to a temporary file to avoid shell argument escaping issues
        echo "${{ github.event.inputs.urls }}" > temp_urls_list.txt
        
        # Build command flags
        ENHANCE_FLAG="--enhance"
        if [ "${{ github.event.inputs.enhance }}" = "false" ]; then
          ENHANCE_FLAG="--no-enhance"
        fi
        
        FORCE_FLAG=""
        if [ "${{ github.event.inputs.force }}" = "true" ]; then
          FORCE_FLAG="--force"
        fi
        
        python faceswapper/run_faceswap.py \
          --urls temp_urls_list.txt \
          --influencer "${{ github.event.inputs.influencer_image }}" \
          $ENHANCE_FLAG \
          $FORCE_FLAG
          
        # Clean up the temp URL file
        rm -f temp_urls_list.txt

    - name: Commit and Push Updated Swaps and History
      if: always()
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add faceswapper/history.json swapped_reels/ || true
        git commit -m "Update swapped reels and history logs [skip ci]" || true
        git push origin main || true

    - name: Upload Swapped Reels as Workflow Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: swapped-reels
        path: swapped_reels/
        retention-days: 14
